name: Deploy to Railway

# Deploy via Railway CLI + Project Token (NÃO usa a integração GitHub-App do Railway).
# Pré-requisitos:
#   1. Secret RAILWAY_TOKEN = Project Token (Railway → Project → Settings → Tokens,
#      scoped ao environment `production`). Definir SÓ no repo canónico para evitar
#      deploy duplicado quando se sincroniza para outro remote/fork.
#   2. Desligar a integração nativa GitHub do Railway nos serviços `api` e `worker`
#      (Settings → Source → Disconnect), senão cada push faz 2 deploys.

on:
  push:
    branches: [main]

# Serializa deploys do mesmo branch — evita corridas se houver pushes seguidos.
concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Espelha os watchPatterns de railway.api.toml / railway.worker.toml.
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared-contracts/**'
              - 'packages/shared-instagram/**'
              - 'Dockerfile.api'
            worker:
              - 'apps/worker/**'
              - 'packages/shared-contracts/**'
              - 'packages/shared-instagram/**'
              - 'Dockerfile.worker'

  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: Deploy api
        run: railway up --service api --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: Deploy worker
        run: railway up --service worker --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
