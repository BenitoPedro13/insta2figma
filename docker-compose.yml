services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: insta2figma
      POSTGRES_PASSWORD: insta2figma
      POSTGRES_DB: insta2figma
    volumes:
      - insta2figma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U insta2figma -d insta2figma']
      interval: 3s
      timeout: 5s
      retries: 12

volumes:
  insta2figma_pgdata:
