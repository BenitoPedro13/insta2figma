# Config do serviço API no Railway.
# No dashboard: Settings → Config-as-code → /railway.api.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = ["apps/api/**", "packages/shared-contracts/**", "Dockerfile.api"]

[deploy]
# Migrations antes do container expor /v1/health (evita crash loop no entrypoint).
preDeployCommand = ["pnpm exec prisma migrate deploy"]
healthcheckPath = "/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
