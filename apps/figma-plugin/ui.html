<h2>Insta2Figma</h2>
<p>
  API (base)<br/>
  <input id="base" type="text" style="width:100%;box-sizing:border-box" value="http://127.0.0.1:3333" />
</p>
<p>
  Email (MVP session)<br/>
  <input id="email" type="email" style="width:100%;box-sizing:border-box" placeholder="dev@local.test" />
</p>
<p>
  Username Instagram<br/>
  <input id="username" type="text" style="width:100%;box-sizing:border-box" placeholder="google" />
</p>
<p><button id="import">Import profile to canvas</button></p>
<p><button id="cancel">Close</button></p>
<p id="status" style="font-size:11px;color:#666;max-height:72px;overflow:auto"></p>
<script>
const $ = (id) => document.getElementById(id);

function setStatus(t) {
  $('status').textContent = t;
}

function msgToText(v) {
  if (typeof v === 'string') return v;
  try {
    return JSON.stringify(v);
  } catch (e) {
    return String(v);
  }
}

function normBase(b) {
  return String(b || '').trim().replace(/\/+$/, '');
}

$('import').onclick = () => {
  const base = normBase($('base').value);
  const email = String($('email').value || '').trim();
  const usernameRaw = String($('username').value || '').trim().replace(/^@+/, '');
  if (!base || !email || !usernameRaw) {
    setStatus('Enter API base URL, email, and username.');
    return;
  }
  $('import').disabled = true;
  setStatus('Starting…');
  parent.postMessage(
    {
      pluginMessage: {
        type: 'import-profile',
        base: base,
        email: email,
        username: usernameRaw.toLowerCase(),
      },
    },
    '*',
  );
};

$('cancel').onclick = () => {
  parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
};

window.addEventListener('message', function (ev) {
  const pm = ev.data && ev.data.pluginMessage;
  if (!pm || !pm.type) return;
  if (pm.type === 'import-status' && pm.text) {
    setStatus(pm.text);
    return;
  }
  if (pm.type === 'import-error') {
    $('import').disabled = false;
    setStatus('Error: ' + (pm.message != null ? msgToText(pm.message) : 'unknown'));
    return;
  }
  if (pm.type !== 'import-done') return;
  $('import').disabled = false;
  var t = pm.error
    ? 'Placement failed: nothing imported.'
    : 'Placed ' + pm.placed + '/' + pm.total + ' on the canvas.';
  setStatus(t);
});
</script>
